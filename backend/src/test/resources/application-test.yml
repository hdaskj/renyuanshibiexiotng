spring:
  datasource:
    url: jdbc:h2:mem:ai03test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  sql:
    init:
      mode: always
      encoding: UTF-8
  flyway:
    enabled: false

app:
  model-service:
    base-url: http://127.0.0.1:1
  cors:
    allowed-origins: http://localhost:4173
