spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ai03}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USER:ai03}
    password: ${DB_PASSWORD:ai03}
  sql:
    init:
      mode: never
  flyway:
    enabled: true
    locations: classpath:db/migration-postgres
    baseline-on-migrate: true

app:
  vector-store:
    provider: ${VECTOR_STORE_PROVIDER:local}
    milvus:
      base-url: ${MILVUS_URL:http://localhost:19530}
      collection: ${MILVUS_COLLECTION:ai03_photos}
      fail-open: ${MILVUS_FAIL_OPEN:false}
