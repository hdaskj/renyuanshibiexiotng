services:
  model-service:
    build:
      context: ./model_service
    expose:
      - "8090"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health', timeout=2)"
        ]
      interval: 5s
      timeout: 3s
      retries: 12

  backend:
    build:
      context: ./backend
    ports:
      - "8081:8081"
    environment:
      APP_MODEL_SERVICE_BASE_URL: http://model-service:8090
    volumes:
      - backend-data:/app/data
    depends_on:
      model-service:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "sh",
          "-c",
          "wget -qO- http://127.0.0.1:8081/api/v1/health | grep -q '\"status\":\"UP\"'"
        ]
      interval: 10s
      timeout: 3s
      retries: 12

  frontend:
    build:
      context: ./frontend
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  backend-data:
